name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不要用 android-actions/setup-android@v3。
      # 它内部会跑 `sdkmanager tools`，而 "tools" 这个包在现代 SDK 仓库里已经不存在，
      # sdkmanager 直接以 exit 1 退出，导致整个 job 在装 SDK 这步就挂掉
      # （报 "Failed to find package 'tools'"）。2026-09 实测如此。
      #
      # ubuntu-latest 镜像本来就预装了 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 这里只补上本项目需要的 platform 与 build-tools；装不上也不失败，
      # AGP 自己还有 sdkDownload 兜底。
      - name: Ensure Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 从 Secrets 还原发布签名。
      # 没配 secrets 也不失败 —— app/build.gradle.kts 在找不到 keystore.properties 时
      # 会让 release 退回 debug 签名，CI 照样能出可安装的包。
      #
      # 需要的 secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      #   KEYSTORE_BASE64 的生成方式见 README「发布签名」一节。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 KEYSTORE_BASE64 —— release 将退回 debug 签名"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PW" "$KS_ALIAS" "$KS_KEY_PW" > keystore.properties
          echo "发布签名已就绪"

      - name: Build debug + release APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Show signing result
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)
            "$BT/apksigner" verify --print-certs "$APK" || true
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: videowall-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: videowall-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 推 tag 时顺手发一个 Release，省得每次手动传 APK
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "自动构建产物。版本 ${GITHUB_REF_NAME}。" \
            app/build/outputs/apk/release/*.apk
