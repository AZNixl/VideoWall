name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不要用 android-actions/setup-android@v3。
      # 它内部会跑 `sdkmanager tools`，而 "tools" 这个包在现代 SDK 仓库里已经不存在，
      # sdkmanager 直接以 exit 1 退出，导致整个 job 在装 SDK 这步就挂掉
      # （报 "Failed to find package 'tools'"）。2026-09 实测如此。
      #
      # ubuntu-latest 镜像本来就预装了 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 这里只补上本项目需要的 platform 与 build-tools；装不上也不失败，
      # AGP 自己还有 sdkDownload 兜底。
      - name: Ensure Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 从 Secrets 还原发布签名。
      # 没配 secrets 也不失败 —— app/build.gradle.kts 在找不到 keystore.properties 时
      # 会让 release 退回 debug 签名，CI 照样能出可安装的包。
      #
      # 需要的 secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      #   KEYSTORE_BASE64 的生成方式见 README「发布签名」一节。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 KEYSTORE_BASE64 —— release 将退回 debug 签名"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PW" "$KS_ALIAS" "$KS_KEY_PW" > keystore.properties
          echo "发布签名已就绪"

      - name: Build debug + release APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Show signing result
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)
            "$BT/apksigner" verify --print-certs "$APK" || true
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: videowall-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: videowall-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 推 tag 时顺手发一个 Release，省得每次手动传 APK。
      #
      # 发布物一律用英文名：
      #   · 资产文件名 VideoWall-<tag>-release.apk（否则是 app-release.apk，
      #     下了三四个版本之后根本分不清哪个是哪个）
      #   · release notes 也写英文，仓库对外可见，中文备注对国际用户没意义
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          mv "$APK" "app/build/outputs/apk/release/VideoWall-${GITHUB_REF_NAME}-release.apk"

          NOTES="Automated build of VideoWall ${GITHUB_REF_NAME}.

          - Signed with the project release key (see README for the certificate fingerprint).
          - Android 7.0+ (minSdk 24). No native libraries, so it runs on armeabi-v7a, arm64-v8a and x86 alike.
          - Installable over any earlier build signed with the same key.

          See CHANGELOG.md for the full version history."

          # 同一个 tag 可能被重发（比如把 tag 强制移到新提交上）。
          # 这时候 gh release create 会因为"已存在"直接失败，把整个 job 带下去 ——
          # 所以先探一下，已存在就改成覆盖资产 + 更新说明。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，覆盖资产与说明"
            gh release upload "${GITHUB_REF_NAME}" app/build/outputs/apk/release/*.apk --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "VideoWall ${GITHUB_REF_NAME}" \
              --notes "$NOTES" \
              app/build/outputs/apk/release/*.apk
          fi
